<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Finder</title>
    <style>
        .hotel-card {
            background: white;
            padding: 20px;
            margin: 20px;
            border: 1px solid #ddd;
        }
        .hotel-info h3 {
            color: #333;
        }
        #hotelList {
            margin-top: 20px;
        }
    </style>
    <script>
        console.log("Inline script loaded");
        const hotels = [
            {
                id: 1,
                name: "London Hotel",
                country: "uk",
                city: "London",
                price: 200,
                rating: 4.5,
                images: [
                    "https://via.placeholder.com/200x150?text=Test+Image"
                ],
                amenities: ["Test"],
                roomTypes: ["Test"],
                bookingLink: "#"
            }
        ];
        console.log("Hotels data loaded:", hotels);
    </script>
    <script src="js/hotel.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="search-form">
            <select id="country">
                <option value="">Select a country</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="france">France</option>
            </select>
            <button type="button" id="searchButton">Search Hotels</button>
        </div>
        <div id="hotelList"></div>
    </div>
</body>
</html>
